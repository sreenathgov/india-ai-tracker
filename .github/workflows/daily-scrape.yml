name: Daily AI Tracker Scrape
 
on:
  schedule:
    # Run daily at 11:00 AM IST (5:30 AM UTC)
    - cron: '30 5 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

# Serialize runs so a manual dispatch can't overlap the scheduled run and race
# on the git push (the loser would otherwise fail on a non-fast-forward push).
# cancel-in-progress: false -> let the in-flight data run finish, queue the next.
concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape-and-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
 
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
 
      - name: Check canonical data store
        run: |
          echo "📂 Checking canonical JSON data store..."
          if [ -f api/all-india/categories.json ]; then
            NATIONAL_COUNT=$(python3 -c "import json; data=json.load(open('api/all-india/categories.json')); print(sum(len(articles) for articles in data.get('categories', {}).values()))")
            echo "✓ Canonical store has $NATIONAL_COUNT national articles"
          else
            echo "⚠️  No existing canonical data - starting fresh"
          fi
 
      - name: Run scraper and pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OLLAMA_DISABLED: "true"
          SCRAPE_TIME_WINDOW_HOURS: "96"  # Only scrape articles from last 24 hours
        run: |
          cd backend
 
          # Record canonical JSON count BEFORE scraping
          echo "📊 Checking canonical store before scraping..."
          API_COUNT_BEFORE=$(python3 -c "import json; data=json.load(open('../api/all-india/categories.json')); print(sum(len(articles) for articles in data.get('categories', {}).values()))" 2>/dev/null || echo "0")
          echo "Canonical JSON has $API_COUNT_BEFORE national articles before scraping"
 
          echo ""
          echo "Step 1: Running scraper with 24h time window..."
          echo "  (Global deduplication against canonical JSON)"
          echo "  (Time window: last 24 hours only)"
          PYTHONPATH=. python3 -c "from scrapers.orchestrator import run_all_scrapers; result = run_all_scrapers(); print(f'\\nFinal: {result.get(\"final_processed\", 0)} new articles after dedup & filtering')"
 
          echo ""
          echo "Step 2: Running 3-layer AI processing pipeline..."
          PYTHONPATH=. python3 ai/integrated_pipeline.py
 
          echo ""
          echo "Step 3: Merging into canonical JSON store..."
          echo "  (Using MERGE logic - never reduces count)"
          PYTHONPATH=. python3 scripts/generate_static_api.py
 
          # Verify canonical JSON was updated (should increase or stay same, never decrease)
          echo ""
          echo "🔍 Verifying merge results..."
          API_COUNT_AFTER=$(python3 -c "import json; data=json.load(open('../api/all-india/categories.json')); print(sum(len(articles) for articles in data.get('categories', {}).values()))" 2>/dev/null || echo "0")
          echo "Canonical JSON now has $API_COUNT_AFTER national articles"
 
          if [ "$API_COUNT_AFTER" -lt "$API_COUNT_BEFORE" ]; then
            echo "❌ ERROR: Article count DECREASED ($API_COUNT_BEFORE → $API_COUNT_AFTER)!"
            echo "❌ This violates the 'never reduce count' invariant!"
            echo "❌ Refusing to commit - this is a critical bug!"
            exit 1
          fi
 
          echo "✅ Merge successful: $API_COUNT_BEFORE → $API_COUNT_AFTER (+$(($API_COUNT_AFTER - $API_COUNT_BEFORE)))"
          echo ""
          echo "Step 4: Complete!"
 
      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
 
          # Add canonical API files (the source of truth)
          # Database is temp store only - not committed
          git add api/ || true
          git add backend/reports/*.json || true
 
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit (no new articles after deduplication)"
          else
            # Count how many articles were added
            API_COUNT=$(python3 -c "import json; data=json.load(open('api/all-india/categories.json')); print(sum(len(articles) for articles in data.get('categories', {}).values()))" 2>/dev/null || echo "unknown")
 
            git commit -m "Daily update: Merge new articles into canonical store - $(date +'%Y-%m-%d %H:%M IST')" \
                       -m "Total national articles: $API_COUNT" \
                       -m "Co-Authored-By: Claude Sonnet 4.5 <noreply@anthropic.com>"
            git push
          fi
 
      - name: Generate summary and log counts
        run: |
          python3 backend/scripts/daily_summary.py || echo "Could not generate summary"
