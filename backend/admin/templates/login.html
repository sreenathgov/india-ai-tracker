{% extends "base.html" %}

{% block title %}Login - India AI Tracker Admin{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-blue-100">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-lg">
        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                India AI Tracker
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Local Admin Tool
            </p>
            <p class="mt-1 text-center text-xs text-gray-500">
                🔒 Localhost only - Not accessible remotely
            </p>
        </div>
        <form class="mt-8 space-y-6" action="{{ url_for('login') }}" method="POST">
            <div class="rounded-md shadow-sm -space-y-px">
                <div>
                    <label for="password" class="sr-only">Password</label>
                    <input id="password" name="password" type="password" required
                           class="appearance-none rounded-lg relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
                           placeholder="Enter admin password"
                           autofocus>
                </div>
            </div>

            <div>
                <button type="submit"
                        class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Sign in
                </button>
            </div>
        </form>

        <div class="mt-6 text-xs text-gray-500 text-center space-y-1">
            <p>💡 Default password: <code class="bg-gray-100 px-2 py-1 rounded">admin</code></p>
            <p>Set custom: <code class="bg-gray-100 px-2 py-1 rounded">export ADMIN_PASSWORD="your-password"</code></p>
        </div>
    </div>
</div>
{% endblock %}
