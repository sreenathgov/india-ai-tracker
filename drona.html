    <style>
        @font-face {
            font-family: 'Telegraf';
            src: url('assets/fonts/Telegraf-UltraBold.otf') format('opentype');
            font-weight: 800;
            font-style: normal;
            font-display: swap;
        }

        /* ── HOLDING PAGE — Drona, coming soon ── */
        :root {
            --dr-maroon-deep: #200b0d;
            --dr-maroon-mid:  #4a1820;
            --dr-wine:        #762c36;
            --dr-cream:       #eeebe3;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            background: var(--dr-maroon-deep);
            color: var(--dr-cream);
            font-family: 'Telegraf', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        /* Radial ambient glow — pure CSS, no image assets */
        .dr-hold-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 60% at 50% 40%,
                    rgba(74, 24, 32, 0.9) 0%,
                    rgba(32, 11, 13, 0) 70%),
                radial-gradient(ellipse 50% 40% at 50% 55%,
                    rgba(226, 165, 66, 0.06) 0%,
                    transparent 70%);
            pointer-events: none;
        }

        /* Prism WebGL background layer — sits between the ambient glow and the grid overlay */
        .dr-hold-prism {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        /* Tint layer — forces the prism's full-spectrum render into wine-red /
           cream variations only (no blue, green or yellow allowed through) */
        .dr-hold-tint {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: var(--dr-wine);
            mix-blend-mode: hue;
            pointer-events: none;
        }

        /* Subtle grid overlay */
        .dr-hold-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(238, 235, 227, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(238, 235, 227, 0.03) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 20%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 20%, transparent 80%);
            pointer-events: none;
        }

        /* Main stage */
        .dr-hold-stage {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(5rem, 12vh, 9rem) clamp(1.5rem, 6vw, 5rem);
            text-align: center;
        }

        /* Wordmark */
        .dr-hold-wordmark {
            font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
            font-weight: 500;
            font-style: italic;
            font-size: clamp(3.5rem, 11vw, 9.5rem);
            line-height: 0.95;
            letter-spacing: -0.025em;
            color: var(--dr-cream);
            margin-bottom: 2.75rem;
            opacity: 0;
            animation: dr-hold-fade-up 1s ease-out 0.4s forwards;
        }

        /* Divider rule */
        .dr-hold-rule {
            width: 56px;
            height: 1.5px;
            background: #ffffff;
            margin: 0 auto 2.5rem;
            opacity: 0;
            animation: dr-hold-fade-up 0.8s ease-out 0.7s forwards,
                       dr-hold-pulse 3.5s ease-in-out 1.5s infinite;
            transform-origin: center;
        }

        /* Message */
        .dr-hold-message {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 400;
            font-style: italic;
            font-size: clamp(1.15rem, 2.2vw, 1.65rem);
            line-height: 1.5;
            color: rgba(238, 235, 227, 0.78);
            max-width: 38ch;
            margin: 0 auto 3.5rem;
            opacity: 0;
            animation: dr-hold-fade-up 0.9s ease-out 0.9s forwards;
        }

        /* Home link */
        .dr-hold-back {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            font-family: 'Telegraf', 'Inter', sans-serif;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(238, 235, 227, 0.48);
            text-decoration: none;
            border-bottom: 1px solid rgba(238, 235, 227, 0.18);
            padding-bottom: 0.2rem;
            transition: color 0.25s ease, border-color 0.25s ease;
            opacity: 0;
            animation: dr-hold-fade-up 0.8s ease-out 1.1s forwards;
        }

        .dr-hold-back:hover {
            color: rgba(238, 235, 227, 0.88);
            border-color: rgba(238, 235, 227, 0.5);
        }

        .dr-hold-back-arrow {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .dr-hold-back:hover .dr-hold-back-arrow {
            transform: translateX(-3px);
        }

        /* Animations */
        @keyframes dr-hold-fade-up {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes dr-hold-pulse {
            0%, 100% { width: 56px; opacity: 1; }
            50%       { width: 80px; opacity: 0.7; }
        }

        @media (prefers-reduced-motion: reduce) {
            .dr-hold-wordmark, .dr-hold-rule,
            .dr-hold-message, .dr-hold-back {
                opacity: 1;
                animation: none;
            }
        }

        /* Responsive tweaks */
        @media (max-width: 480px) {
            .dr-hold-stage {
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <!-- Ambient background layers -->
    <div class="dr-hold-bg" aria-hidden="true"></div>
    <div id="demo-prism-bg" class="dr-hold-prism" aria-hidden="true" data-animation-type="3drotate" data-height="3.5" data-base-width="5.6" data-scale="3.6" data-hue-shift="0" data-color-frequency="1" data-noise="0" data-glow="1" data-time-scale="0.5"></div>
    <div class="dr-hold-tint" aria-hidden="true"></div>
    <div class="dr-hold-grid" aria-hidden="true"></div>

    <!-- Staggered nav injected here by staggered-menu.js -->

    <main class="dr-hold-stage" id="main-content">

        <h1 class="dr-hold-wordmark">Drona</h1>

        <div class="dr-hold-rule" aria-hidden="true"></div>

        <p class="dr-hold-message">
            Exciting things coming soon.
        </p>

        <a href="/" class="dr-hold-back" id="dr-hold-home-link">
            <span class="dr-hold-back-arrow" aria-hidden="true">←</span>
            Back to Home
        </a>

    </main>

    <!-- ── Staggered nav + footer ── -->
    <script src="js/staggered-menu.js?v=12" defer></script>
    <script src="js/footer.js?v=4" defer></script>

</body>
