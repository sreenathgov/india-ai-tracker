# Product Map for Kananlabs.in Platform
# ====================================
# This file defines product boundaries for the kananlabs.in platform.
# Each product is listed with its owned files and directories.
#
# Purpose: Enable clear scoping for Claude, developers, and the non-technical owner
# Maintained: Update this file when new products launch or files change ownership
# Authority: Use this map to determine which product owns a file during development

products:

  india-ai-tracker:
    description: |
      Core product. Tracks AI developments, policies, and startup news across Indian states.
      Automated daily scraping, AI-based filtering/categorization, static JSON publishing.
    owned_paths:
      # Backend scraping and processing pipeline
      - backend/app.py
      - backend/local_admin.py
      - backend/scheduler.py
      - backend/run_scraper_only.py
      - backend/run_processor.py
      - backend/models/
      - backend/utils/
      - backend/scrapers/
      - backend/ai/
      - backend/social/
      - backend/admin/
      - backend/scripts/generate_static_api.py
      - backend/config/filters.yaml
      - backend/sources.json
      - backend/.env
      - backend/tracker.db
      - instance/tracker.db

      # Static API data (canonical store)
      - api/all-india/
      - api/states/
      - api/backups/
      - api/blacklist.json
      - api/last-updated.json

      # Frontend UI and interactive map
      - index.html
      - index-new.html
      - admin.html
      - scroll-test.html
      - about.html
      - js/app-final.js
      - js/app.js
      - js/app-new.js
      - js/app-working.js
      - js/india-states.geojson
      - css/styles-v2.css
      - css/styles.css

      # CI/CD for India AI Tracker
      - backend/scripts/daily_update.sh
      - backend/scripts/daily_summary.py
      - backend/scripts/check_services.sh
      - backend/scripts/post_to_x.py
      - backend/scripts/migrate_*.py
      - .github/workflows/

  publications:
    description: |
      Research publications product. Long-form articles with progressive disclosure UI.
      Readers access curated research content via table-of-contents sidebar layout.
    owned_paths:
      # Publications UI
      - publications.html
      - js/publications.js
      - css/publications.css

      # Publications content
      - content/publications/
      - content/publications/sample-publication.md

  sector-watch:
    description: |
      [Planned] Sector Watch product. Detailed sector analysis and industry trends.
      To be implemented; backend and frontend TBD.
    owned_paths:
      # Placeholder for future implementation
      # - sector-watch.html
      # - js/sector-watch.js
      # - css/sector-watch.css
      # - content/sector-watch/

shared_resources:
  description: |
    Files shared across all products. Modify with care—changes affect entire platform.
  owned_paths:
    - assets/
    - assets/images/
    - assets/fonts/
    - vercel.json
    - .vercelignore
    - .gitignore
    - system-map.md
    - CLAUDE_RULES.md
    - README.md
    - ARCHITECTURE.md
    - AUTOMATED_WORKFLOW.md
    - FULL_AUTOMATION_IMPLEMENTATION.md
    - DEPLOYMENT_GUIDE.md
    - USAGE_GUIDE.md
    - QUICK_START.md
    - WORKFLOW_UPDATES.md
    - LOCAL_ADMIN.md
    - .product-map.yaml

scoping_rules:
  - |
    When working on a specific product, consult this map to confirm file scope.
    Only modify files listed under that product's "owned_paths" unless cross-product
    coordination is explicitly required.

  - |
    Cross-product changes (e.g., modifying shared resources) require acknowledging
    the impact on all products. Use CLAUDE_RULES.md escalation protocol if uncertain.

  - |
    When a new product launches, add it to this map with its owned_paths before
    development begins. This prevents scope creep and deployment confusion.

  - |
    Non-technical owner: Use this map to audit changes. If Claude modifies files
    outside the assigned product's owned_paths without explanation, that's a red flag.

deployment_notes:
  vercel: |
    All products (India AI Tracker, Publications, Sector Watch) share a single
    Vercel deployment. Frontend files from all products are deployed to kananlabs.in
    static site. Deployment is driven by git push to main branch.

  backend: |
    Backend serves India AI Tracker API primarily. If Sector Watch or Publications
    require backend scraping/processing, add new routes to backend/app.py and
    document here. Current architecture supports monolithic backend.

  github_actions: |
    CI/CD workflows in .github/workflows/ currently orchestrate India AI Tracker
    daily pipeline. When new products need automation, add new workflows with
    clear naming convention (e.g., sector-watch-daily.yml).

