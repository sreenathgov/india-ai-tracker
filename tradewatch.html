    <style>
        @font-face {
            font-family: 'Telegraf';
            src: url('assets/fonts/Telegraf-UltraBold.otf') format('opentype');
            font-weight: 800;
            font-style: normal;
            font-display: swap;
        }

        /* ── HOLDING PAGE — TradeWatch revamp in progress ── */
        :root {
            --tw-navy:       #0a2f52;
            --tw-navy-deep:  #061f38;
            --tw-navy-mid:   #0d3662;
            --tw-cream:      #eeebe3;
            --tw-red:        #db4a2b;
            --tw-amber:      #f0b93a;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            background: var(--tw-navy-deep);
            color: var(--tw-cream);
            font-family: 'Telegraf', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        /* Radial ambient glow — pure CSS, no image assets */
        .tw-hold-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 60% at 50% 40%,
                    rgba(13, 54, 98, 0.85) 0%,
                    rgba(6, 31, 56, 0) 70%),
                radial-gradient(ellipse 50% 40% at 50% 55%,
                    rgba(219, 74, 43, 0.07) 0%,
                    transparent 70%);
            pointer-events: none;
        }

        /* Prism WebGL background layer — sits between the ambient glow and the grid overlay */
        .tw-hold-prism {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        /* Subtle grid overlay */
        .tw-hold-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(238, 235, 227, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(238, 235, 227, 0.03) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 20%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 20%, transparent 80%);
            pointer-events: none;
        }

        /* Main stage */
        .tw-hold-stage {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(5rem, 12vh, 9rem) clamp(1.5rem, 6vw, 5rem);
            text-align: center;
        }

        /* Eyebrow label */
        .tw-hold-eyebrow {
            font-family: 'Telegraf', 'Inter', sans-serif;
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--tw-red);
            margin-bottom: 2.25rem;
            opacity: 0;
            animation: tw-hold-fade-up 0.9s ease-out 0.2s forwards;
        }

        /* Wordmark */
        .tw-hold-wordmark {
            font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
            font-weight: 500;
            font-style: italic;
            font-size: clamp(3.5rem, 11vw, 9.5rem);
            line-height: 0.95;
            letter-spacing: -0.025em;
            color: var(--tw-cream);
            margin-bottom: 2.75rem;
            opacity: 0;
            animation: tw-hold-fade-up 1s ease-out 0.4s forwards;
        }

        /* Divider rule */
        .tw-hold-rule {
            width: 56px;
            height: 1.5px;
            background: var(--tw-red);
            margin: 0 auto 2.5rem;
            opacity: 0;
            animation: tw-hold-fade-up 0.8s ease-out 0.7s forwards,
                       tw-hold-pulse 3.5s ease-in-out 1.5s infinite;
            transform-origin: center;
        }

        /* Message */
        .tw-hold-message {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 400;
            font-style: italic;
            font-size: clamp(1.15rem, 2.2vw, 1.65rem);
            line-height: 1.5;
            color: rgba(238, 235, 227, 0.78);
            max-width: 38ch;
            margin: 0 auto 3.5rem;
            opacity: 0;
            animation: tw-hold-fade-up 0.9s ease-out 0.9s forwards;
        }

        /* Home link */
        .tw-hold-back {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            font-family: 'Telegraf', 'Inter', sans-serif;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(238, 235, 227, 0.48);
            text-decoration: none;
            border-bottom: 1px solid rgba(238, 235, 227, 0.18);
            padding-bottom: 0.2rem;
            transition: color 0.25s ease, border-color 0.25s ease;
            opacity: 0;
            animation: tw-hold-fade-up 0.8s ease-out 1.1s forwards;
        }

        .tw-hold-back:hover {
            color: rgba(238, 235, 227, 0.88);
            border-color: rgba(238, 235, 227, 0.5);
        }

        .tw-hold-back-arrow {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .tw-hold-back:hover .tw-hold-back-arrow {
            transform: translateX(-3px);
        }

        /* Animations */
        @keyframes tw-hold-fade-up {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes tw-hold-pulse {
            0%, 100% { width: 56px; opacity: 1; }
            50%       { width: 80px; opacity: 0.7; }
        }

        @media (prefers-reduced-motion: reduce) {
            .tw-hold-eyebrow, .tw-hold-wordmark, .tw-hold-rule,
            .tw-hold-message, .tw-hold-back {
                opacity: 1;
                animation: none;
            }
        }

        /* Responsive tweaks */
        @media (max-width: 480px) {
            .tw-hold-stage {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient background layers -->

    <div class="tw-hold-grid" aria-hidden="true"></div>

        </p>

            Back to Home
        </a>

    </main>

</body>
