<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications - Coming Soon | Kanan Labs</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/staggered-menu.css">

    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

    <!-- Lottie Player -->
    <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs" type="module"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            background: #db4a2b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .placeholder-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 600px;
            padding: 2rem;
            text-align: center;
        }

        .lottie-animation {
            width: 100%;
            max-width: 400px;
            height: auto;
        }

        /* Override staggered menu logo for orange background */
        .sm-logo-img {
            filter: none !important;
        }

        .sm-toggle {
            color: #f4ebd0 !important;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .placeholder-container {
                max-width: 90%;
            }

            .lottie-animation {
                max-width: 300px;
            }
        }

        @media (max-width: 480px) {
            .lottie-animation {
                max-width: 250px;
            }
        }
    </style>
</head>
<body>
    <!-- Staggered menu will be injected here -->

    <div class="placeholder-container">
        <dotlottie-player
            src="added-assets/coming soon.lottie"
            class="lottie-animation"
            background="transparent"
            speed="1"
            loop
            autoplay>
        </dotlottie-player>
    </div>

    <!-- Staggered Menu Script -->
    <script src="js/staggered-menu.js"></script>

    <!-- Override logo for this page -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Wait a brief moment for the menu to be created
            setTimeout(function() {
                const logoImg = document.querySelector('.sm-logo-img');
                if (logoImg) {
                    logoImg.src = 'KANANLABS-LOGO-SET/ORANGE of KANAN-LABS-WEBSITELOGO.png';
                }
            }, 100);
        });
    </script>
</body>
</html>
