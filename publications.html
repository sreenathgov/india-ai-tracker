<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications - India AI Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles-v2.css?v=21">
    <link rel="stylesheet" href="css/staggered-menu.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs" type="module"></script>
    <style>
        html {
            height: auto !important;
            overflow: auto !important;
        }

        body.publications-coming-soon {
            height: auto !important;
            overflow: auto !important;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--brand-navy);
        }

        .coming-soon-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            text-align: center;
        }

        .coming-soon-animation {
            width: 220px;
            height: 220px;
            margin-bottom: 1.5rem;
        }

        .coming-soon-label {
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--brand-cream);
            opacity: 0.45;
            margin-bottom: 0.75rem;
        }

        .coming-soon-title {
            font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
            font-size: 2.25rem;
            font-weight: 600;
            color: var(--brand-cream);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .coming-soon-description {
            font-family: 'Inter', sans-serif;
            font-size: 0.9375rem;
            color: var(--brand-cream);
            opacity: 0.6;
            line-height: 1.7;
            max-width: 480px;
            margin: 0 auto 2.5rem;
        }

        .coming-soon-back {
            display: inline-block;
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--brand-navy);
            background: var(--brand-cream);
            padding: 0.75rem 1.75rem;
            border-radius: 6px;
            text-decoration: none;
            transition: opacity 0.15s ease;
        }

        .coming-soon-back:hover {
            opacity: 0.88;
        }

        .sm-toggle {
            color: var(--brand-cream) !important;
        }
    </style>
</head>
<body class="publications-coming-soon">
    <!-- Staggered menu will be injected here by staggered-menu.js -->

    <div style="height: 80px;"></div>

    <main class="coming-soon-main">
        <dotlottie-player
            class="coming-soon-animation"
            src="added-assets/coming soon.lottie"
            background="transparent"
            speed="1"
            loop
            autoplay>
        </dotlottie-player>

        <p class="coming-soon-label">Publications</p>
        <h1 class="coming-soon-title">Coming Soon</h1>
        <p class="coming-soon-description">
            In-depth reports and analysis on AI governance, policy developments, and regulatory trends across India are on their way.
        </p>
        <a href="index.html" class="coming-soon-back">Back to Tracker</a>
    </main>

    <footer class="site-footer">
        <p class="footer-attribution">Built and maintained by Sreenath Govindarajan</p>
        <p class="footer-links">
            <a href="https://www.linkedin.com/in/sreenathgovindarajan" target="_blank" rel="noopener">LinkedIn</a>
            <span class="separator">·</span>
            <a href="mailto:sreenath.govin@gmail.com">Email</a>
            <span class="separator">·</span>
            <a href="about.html">About this project</a>
        </p>
    </footer>

    <script src="js/staggered-menu.js"></script>
</body>
</html>
